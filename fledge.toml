[tasks]
build = "cargo build --release"
dev = "cargo build"
test = "cargo test"
check = "cargo clippy -- -D warnings"
fmt = "cargo fmt --check"
shellcheck = "shellcheck bin/build.sh"
manifest = "grep -q 'binary = \"bin/fledge-todo\"' plugin.toml && grep -q 'build = \"bin/build.sh\"' plugin.toml"
smoke-json = "./target/release/fledge-plugin-todo --json | python3 -c \"import sys,json; data=json.load(sys.stdin); assert data['schema_version'] == 1 and data['action'] == 'todo'\""
smoke-blocking = "./target/release/fledge-plugin-todo --fail-on-todo >/dev/null 2>&1; test $? -eq 1"

[lanes.verify]
description = "Format, lint, test, build, and smoke-test the Todo Fledge plugin"
steps = ["fmt", "check", "test", "build", "shellcheck", "manifest", "smoke-json", "smoke-blocking"]
